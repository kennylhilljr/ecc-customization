# The ECC and OpenClaw stack, pinned. bootstrap.sh reads this file; change a
# version here, commit, and every machine picks it up on its next bootstrap.
# Plain KEY="value" lines only (sourced by bash 3.2). No secrets here:
# KEYCHAIN_SECRETS lists names, never values.

# Where repositories live.
GITHUB_DIR="$HOME/Documents/GitHub"
GITHUB_OWNER="kennylhilljr"

# Platform repositories (cloned, or fast-forwarded when clean).
ORCH_REPO="openclaw-ecc-orchestrator"
INFRA_REPO="agent-control-plane-infra"
# Projects built with ECC (cloned when missing; never changed otherwise).
PROJECT_REPOS="research-mcp ctxd"

# Toolchain. Node 24 is the version ECC 2.2.2 was validated on.
NODE_VERSION="24"
BREW_FORMULAS="git gh uv jq python@3.13"
NVM_VERSION="v0.40.3"

# Runner CLIs (npm, under nvm's default Node): "pkg@latest" or an exact version.
CLAUDE_CODE_PKG="@anthropic-ai/claude-code@latest"
CODEX_PKG="@openai/codex@latest"
GEMINI_PKG="@google/gemini-cli@latest"
OPENCLAW_PKG="openclaw@2026.9.6"

# ECC (everything-claude-code), installed natively, once per harness.
ECC_MARKETPLACE="affaan-m/ECC"
ECC_PLUGIN="ecc@ecc"
ECC_CLAUDE_SCOPE="user"

# Runners certified on a new machine and by the weekly launchd job.
ECC_RUNNERS="claude,codex,gemini"

# Orchestrator locations (they match .orchestration/ecc.json in each project).
ECC_STATE_DIR="$HOME/.local/state/openclaw-ecc-orchestrator"
ECC_RUNTIME_DIR="$HOME/.local/share/openclaw-ecc-orchestrator/runtime"

# Keychain items (service = the name, account = $USER). Names only.
KEYCHAIN_SECRETS="GEMINI_API_KEY GROQ_API_KEY MOONSHOT_API_KEY OPENROUTER_API_KEY"

# Local backups of OpenClaw state (outside Git, owner-only).
BACKUP_DIR="$HOME/AgentPlatformBackups"
