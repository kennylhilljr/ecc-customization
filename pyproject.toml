# Lint settings only; this repository is not a Python package.
# scripts/check.sh runs `ruff check` with these settings.

[tool.ruff]
# The Python floor in AGENTS.md. FA102 then reports PEP 604 unions such as
# `X | None` in annotations, which fail at import on Python 3.9 without
# `from __future__ import annotations`.
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "FA"]
